<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Task (Admin)</title>
<style>
  body { background:#121212; color:#fff; font-family:Arial; text-align:center; }
  form { max-width:400px; margin:30px auto; background:#1f1f1f; padding:20px; border-radius:8px; }
  input, textarea { width:100%; margin:8px 0; padding:8px; border:none; border-radius:4px; }
  button { background:#4CAF50; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer; }
</style>
</head>
<body>
<h1>🛠 Add New Task</h1>
<form onsubmit="addTask(event)">
  <input type="text" id="title" placeholder="Task Title" required>
  <textarea id="desc" placeholder="Description" required></textarea>
  <input type="number" id="reward" placeholder="Reward e.g. 0.50" required>
  <button type="submit">Add Task</button>
</form>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
<script>
  const app = firebase.initializeApp({ /* your config */ });
  const db = firebase.firestore();

  function addTask(e) {
    e.preventDefault();
    db.collection("tasks").add({
      title: document.getElementById('title').value,
      description: document.getElementById('desc').value,
      reward: parseFloat(document.getElementById('reward').value),
      date: new Date().toISOString().substr(0,10)
    }).then(()=>{
      alert("✅ Task added!");
    });
  }
</script>
</body>
</html>
